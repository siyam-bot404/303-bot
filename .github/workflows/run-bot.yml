name: Node.js CI 24/7 Uptime

on:
  workflow_dispatch:
  schedule:
    # প্রতি ৫ ঘণ্টা পরপর অটোমেটিক রিস্টার্ট হবে যেন GitHub-এর ৬ ঘণ্টার লিমিটে বট বন্ধ না হয়
    - cron: "0 */5 * * *"

# If a new run starts while one is already going, cancel the old one first.
concurrency:
  group: bot-runner
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - run: npm install
    
    - name: Run Bot with 24/7 Auto-Restart Loop
      run: |
        echo "🚀 Starting 24/7 Messenger/Telegram Bot Engine..."
        # বট কোনো কারণে ক্র্যাশ করলে বা এক্সিট কোড দিলে এই লুপ ৫ সেকেন্ড পর পর অটোমেটিক রিস্টার্ট করবে
        until npm start; do
          echo "⚠️ Bot crashed or stopped. Restarting automatically in 5 seconds..." >&2
          sleep 5
        done
        
